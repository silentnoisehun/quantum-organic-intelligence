name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: "Rust crates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "fluid-stratos: build"
        run: cargo build --manifest-path crates/fluid-stratos/Cargo.toml
      - name: "fluid-stratos: regression tests"
        run: cargo test --manifest-path crates/fluid-stratos/Cargo.toml
      - name: "quantum-bridge: build"
        run: cargo build --manifest-path crates/quantum-bridge/Cargo.toml
      - name: "quantum-bridge: tests"
        run: cargo test --manifest-path crates/quantum-bridge/Cargo.toml
      - name: "clippy"
        run: |
          cargo clippy --manifest-path crates/fluid-stratos/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/quantum-bridge/Cargo.toml --all-targets -- -D warnings
      - name: "formatting"
        run: |
          cargo fmt --manifest-path crates/fluid-stratos/Cargo.toml -- --check
          cargo fmt --manifest-path crates/quantum-bridge/Cargo.toml -- --check

  python:
    name: "Measurement scripts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "install dependencies"
        run: pip install numpy
      - name: "the 10-shot mathematics"
        run: python scripts/quantum_10shot_math.py
      - name: "the fluid awakening measurement"
        run: python scripts/gpe_fft_measurement.py
      - name: "the raw measurement summary"
        run: python scripts/summarize_hardware_run.py

  paper:
    name: "Build paper PDF"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install TeX Live"
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full biber
      - name: "Compile paper"
        working-directory: paper
        run: |
          pdflatex aisc2027_unified_paper.tex
          bibtex aisc2027_unified_paper
          pdflatex aisc2027_unified_paper.tex
          pdflatex aisc2027_unified_paper.tex
      - name: "Upload PDF artifact"
        uses: actions/upload-artifact@v4
        with:
          name: aisc2027-paper
          path: paper/aisc2027_unified_paper.pdf
          retention-days: 30
